[package]
name = "ttys-agent"
version = "0.2.0"
edition = "2021"

[dependencies]
base64 = "0.22"
libc = "0.2"
native-tls = { version = "0.2", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "native-tls-vendored"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Environment",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_SystemServices",
  "Win32_System_Threading"
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
