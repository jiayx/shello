name: Build Agent

on:
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/build-agents.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "agent/**"
      - ".github/workflows/build-agents.yml"
  workflow_dispatch:

jobs:
  build-agent:
    name: Rust ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: darwin-amd64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            ext: ""
            asset: ttys-agent-darwin-amd64
            test_native: true
          - id: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            ext: ""
            asset: ttys-agent-darwin-arm64
            test_native: true
          - id: linux-amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            ext: ""
            asset: ttys-agent-linux-amd64
            test_native: true
          - id: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: ""
            asset: ttys-agent-linux-arm64
            test_native: true
          - id: windows-amd64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            asset: ttys-agent-windows-amd64.exe
            test_native: true
          - id: windows-arm64
            runner: windows-2025
            target: aarch64-pc-windows-msvc
            ext: ".exe"
            asset: ttys-agent-windows-arm64.exe
            test_native: false

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent

      - name: Test native target
        if: matrix.test_native
        working-directory: agent
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release --all-targets

      - name: Build release agent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd agent
          cargo build --locked --release --target "${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/ttys-agent${{ matrix.ext }}" "../dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: agent-${{ matrix.id }}
          path: dist/*
          if-no-files-found: error

  bundle-release:
    name: Bundle Release Assets
    runs-on: ubuntu-24.04
    needs: build-agent
    if: success()
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > checksums.txt

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
