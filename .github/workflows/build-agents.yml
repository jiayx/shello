name: Build Agent

on:
  pull_request:
    paths:
      - "agent/**"
      - "scripts/release*.sh"
      - "CHANGELOG.md"
      - ".github/workflows/build-agents.yml"
  push:
    tags:
      - "v*"
    paths:
      - "agent/**"
      - ".github/workflows/build-agents.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent

      - name: Check formatting, lints, and tests
        working-directory: agent
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --release --all-targets

      - name: Check portable Rustls fallback
        working-directory: agent
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --no-default-features --features rustls-tls --all-targets -- -D warnings
          cargo test --locked --no-default-features --features rustls-tls --release --all-targets

      - name: Check release tooling
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/release.sh
          sh -n scripts/release-notes.sh
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' agent/Cargo.toml | head -n 1)"
          ./scripts/release-notes.sh "$version" >/dev/null

  native-test:
    name: Native tests ${{ matrix.id }}
    needs: quality
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: darwin-arm64
            runner: macos-15
          - id: windows-amd64
            runner: windows-2025

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent

      - name: Check native lints and tests
        working-directory: agent
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --release --all-targets

  build-agent:
    name: Rust ${{ matrix.id }}
    needs:
      - quality
      - native-test
    # Pull requests validate the Agent; only an immutable version tag builds
    # distributable binaries. This makes a paired main + tag push run once.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: darwin-amd64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            tls: native-tls
            ext: ""
            asset: shello-agent-darwin-amd64
          - id: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            tls: native-tls
            ext: ""
            asset: shello-agent-darwin-arm64
          - id: linux-amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            tls: native-tls
            ext: ""
            asset: shello-agent-linux-amd64
          - id: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            tls: native-tls
            ext: ""
            asset: shello-agent-linux-arm64
          - id: linux-amd64-portable
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            tls: rustls-tls
            ext: ""
            asset: shello-agent-linux-amd64-portable
          - id: linux-arm64-portable
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            tls: rustls-tls
            ext: ""
            asset: shello-agent-linux-arm64-portable
          - id: windows-amd64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            tls: native-tls
            ext: ".exe"
            asset: shello-agent-windows-amd64.exe
          - id: windows-arm64
            runner: windows-2025
            target: aarch64-pc-windows-msvc
            tls: native-tls
            ext: ".exe"
            asset: shello-agent-windows-arm64.exe

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent

      - name: Install native musl toolchain
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release agent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd agent
          if [[ "${{ matrix.target }}" == *linux-musl ]]; then
            export CC=musl-gcc
            export RUSTFLAGS="-C linker=musl-gcc -C target-feature=+crt-static"
          fi
          cargo build --locked --release --target "${{ matrix.target }}" --no-default-features --features "${{ matrix.tls }}"
          if [[ "${{ matrix.target }}" == *linux-musl ]]; then
            binary="target/${{ matrix.target }}/release/shello-agent"
            "$binary" --version
            if readelf -l "$binary" | grep -q INTERP || readelf -d "$binary" | grep -q NEEDED; then
              echo "Portable Agent must be statically linked" >&2
              exit 1
            fi
          fi
          cp "target/${{ matrix.target }}/release/shello-agent${{ matrix.ext }}" "../dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: agent-${{ matrix.id }}
          path: dist/*
          if-no-files-found: error

  bundle-release:
    name: Bundle Release Assets
    runs-on: ubuntu-24.04
    needs: build-agent
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        run: ./scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum shello-agent-* > checksums.txt

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
